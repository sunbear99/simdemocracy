{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align:center; border-left: 5px solid {% if type=='success' %}var(--success){% elif type=='danger' %}var(--danger){% else %}var(--warning){% endif %};">
    <h1 style="color:{% if type=='success' %}var(--success){% elif type=='danger' %}var(--danger){% else %}var(--warning){% endif %};">{{ title }}</h1>
    <p>{{ message }}</p>
    <br>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
